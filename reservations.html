<!doctype html>
<html lang="en">
  <head>
    <title>Gemütlich Inn - Reservations</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The page for making reservations">
    <link rel="stylesheet" href="styles/reservation_style.css">
  </head>
  <body>
    <div id="wrapper">
      <header>
        <h1>Gemütlich Inn</h1>
      </header>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="rooms/klien_room.html">Klien Room</a></li>
          <li><a href="rooms/gross_room.html">Groß Room</a></li>
          <li><a href="rooms/grosser_room.html">Größer Room</a></li>
          <li><a href="events/local_attractions.html">Weekend Events</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="reservations.html">Reservations</a></li>
        </ul>
      </nav>
      <main>
        <h2>Reservations</h2>

        <fieldset>
          <legend>Guest Information</legend>

          <label>Full Name</label>
          <input type="text" id="fullname" required>

          <label>Email</label>
          <input type="email" id="email" required>

          <label>Phone</label>
          <input type="tel" id="phone" required>
        </fieldset>

        <fieldset>
          <legend>Reservation details</legend>

          <label class="selectroom">Select Room</label>
          <select name="roomselect" id="roomselect" required>
            <option value="Choose a room">Choose a room</option>
            <option value="Klien Room">Klien Room</option>
            <option value="Groß Room">Groß Room</option>
            <option value="Größer Room">Größer Room</option>
          </select>

          <label>Check In</label>
          <input type="date" id="checkin" required>

          <label>Check Out</label>
          <input type="date" id="checkout" required>

          <label>Special Requests</label>
          <textarea id="specialrequests"></textarea>
        </fieldset>

        <button>Submit Reservation</button>
      </main>
      <footer>
        Copyright &copy; 2026
        <a href="mailto:lameyer23@amarillocollege.com">Logyn Meyer</a>
      </footer>
    </div>
  </body>
</html>
